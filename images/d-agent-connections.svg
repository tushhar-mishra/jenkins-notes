<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <rect width="900" height="420" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">How agents connect: outbound SSH vs inbound (TCP / WebSocket)</text>

  <rect x="330" y="140" width="240" height="140" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="450" y="168" text-anchor="middle" font-weight="bold" font-size="15" fill="#78350f">CONTROLLER</text>
  <text x="450" y="194" text-anchor="middle" fill="#78350f">:8080 HTTP(S) UI/API/WebSocket</text>
  <text x="450" y="216" text-anchor="middle" fill="#78350f">:50000 inbound TCP (optional)</text>
  <text x="450" y="242" text-anchor="middle" fill="#78350f">executors on built-in node: 0</text>

  <rect x="20" y="70" width="230" height="120" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="135" y="96" text-anchor="middle" font-weight="bold" fill="#14532d">SSH agent (VM)</text>
  <text x="135" y="120" text-anchor="middle" fill="#14532d">sshd :22, user jenkins</text>
  <text x="135" y="140" text-anchor="middle" fill="#14532d">authorized_keys ← controller key</text>
  <text x="135" y="160" text-anchor="middle" fill="#14532d">remoting.jar copied + started</text>
  <line x1="328" y1="170" x2="252" y2="130" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="300" y="132" text-anchor="middle" fill="#334155" font-size="11">controller → :22</text>

  <rect x="20" y="240" width="230" height="120" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="135" y="266" text-anchor="middle" font-weight="bold" fill="#14532d">Inbound agent (TCP)</text>
  <text x="135" y="290" text-anchor="middle" fill="#14532d">java -jar agent.jar -url …</text>
  <text x="135" y="310" text-anchor="middle" fill="#14532d">-secret … -name n1</text>
  <text x="135" y="330" text-anchor="middle" fill="#14532d">protocol JNLP4-connect</text>
  <line x1="252" y1="290" x2="328" y2="240" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="290" y="282" text-anchor="middle" fill="#334155" font-size="11">agent → :50000</text>

  <rect x="650" y="70" width="230" height="120" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="765" y="96" text-anchor="middle" font-weight="bold" fill="#14532d">Inbound agent (WebSocket)</text>
  <text x="765" y="120" text-anchor="middle" fill="#14532d">-webSocket flag</text>
  <text x="765" y="140" text-anchor="middle" fill="#14532d">works through proxies/ingress</text>
  <text x="765" y="160" text-anchor="middle" fill="#14532d">no extra port needed</text>
  <line x1="648" y1="130" x2="572" y2="180" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="620" y="140" text-anchor="middle" fill="#334155" font-size="11">agent → :443/8080</text>

  <rect x="650" y="240" width="230" height="120" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="765" y="266" text-anchor="middle" font-weight="bold" fill="#14532d">Kubernetes pod agent</text>
  <text x="765" y="290" text-anchor="middle" fill="#14532d">created per build by the cloud</text>
  <text x="765" y="310" text-anchor="middle" fill="#14532d">jnlp container = inbound agent</text>
  <text x="765" y="330" text-anchor="middle" fill="#14532d">deleted after the build</text>
  <line x1="648" y1="290" x2="572" y2="250" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>

  <text x="450" y="390" text-anchor="middle" fill="#475569">Who opens the connection decides which firewall rule you need. Topics 50–53.</text>
</svg>
