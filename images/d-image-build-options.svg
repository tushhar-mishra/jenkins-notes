<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <rect width="960" height="400" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">Four ways a build gets a container image built</text>

  <!-- DooD -->
  <rect x="15" y="60" width="220" height="280" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="125" y="86" text-anchor="middle" font-weight="bold" fill="#7f1d1d">DooD</text>
  <rect x="35" y="100" width="180" height="60" rx="6" fill="#ffffff" stroke="#b91c1c"/>
  <text x="125" y="124" text-anchor="middle" fill="#7f1d1d">Jenkins container</text>
  <text x="125" y="144" text-anchor="middle" fill="#7f1d1d">docker CLI only</text>
  <rect x="35" y="210" width="180" height="60" rx="6" fill="#ffffff" stroke="#b91c1c"/>
  <text x="125" y="234" text-anchor="middle" fill="#7f1d1d">HOST dockerd (root)</text>
  <text x="125" y="254" text-anchor="middle" fill="#7f1d1d">builds = siblings</text>
  <line x1="125" y1="160" x2="125" y2="208" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="130" y="190" fill="#334155" font-size="11">docker.sock</text>
  <text x="125" y="300" text-anchor="middle" fill="#7f1d1d">fast · ROOT ON HOST</text>
  <text x="125" y="320" text-anchor="middle" fill="#7f1d1d">labs only</text>

  <!-- DinD -->
  <rect x="250" y="60" width="220" height="280" rx="10" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/>
  <text x="360" y="86" text-anchor="middle" font-weight="bold" fill="#7c2d12">DinD</text>
  <rect x="270" y="100" width="180" height="60" rx="6" fill="#ffffff" stroke="#c2410c"/>
  <text x="360" y="124" text-anchor="middle" fill="#7c2d12">build container</text>
  <text x="360" y="144" text-anchor="middle" fill="#7c2d12">DOCKER_HOST=tcp://docker:2376</text>
  <rect x="270" y="210" width="180" height="60" rx="6" fill="#ffffff" stroke="#c2410c"/>
  <text x="360" y="234" text-anchor="middle" fill="#7c2d12">docker:dind sidecar</text>
  <text x="360" y="254" text-anchor="middle" fill="#7c2d12">--privileged</text>
  <line x1="360" y1="160" x2="360" y2="208" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="360" y="300" text-anchor="middle" fill="#7c2d12">isolated daemon · privileged</text>
  <text x="360" y="320" text-anchor="middle" fill="#7c2d12">cold cache → slow</text>

  <!-- Docker agent -->
  <rect x="485" y="60" width="220" height="280" rx="10" fill="#fef9c3" stroke="#a16207" stroke-width="2"/>
  <text x="595" y="86" text-anchor="middle" font-weight="bold" fill="#713f12">Docker-enabled agent</text>
  <rect x="505" y="100" width="180" height="60" rx="6" fill="#ffffff" stroke="#a16207"/>
  <text x="595" y="124" text-anchor="middle" fill="#713f12">controller: no Docker</text>
  <text x="595" y="144" text-anchor="middle" fill="#713f12">agent { label 'docker' }</text>
  <rect x="505" y="210" width="180" height="60" rx="6" fill="#ffffff" stroke="#a16207"/>
  <text x="595" y="234" text-anchor="middle" fill="#713f12">agent VM dockerd</text>
  <text x="595" y="254" text-anchor="middle" fill="#713f12">jenkins ∈ docker group</text>
  <line x1="595" y1="160" x2="595" y2="208" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="595" y="300" text-anchor="middle" fill="#713f12">controller protected</text>
  <text x="595" y="320" text-anchor="middle" fill="#713f12">classic VM CI</text>

  <!-- Daemonless -->
  <rect x="720" y="60" width="225" height="280" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="832" y="86" text-anchor="middle" font-weight="bold" fill="#14532d">Daemonless / rootless</text>
  <rect x="740" y="100" width="185" height="60" rx="6" fill="#ffffff" stroke="#15803d"/>
  <text x="832" y="124" text-anchor="middle" fill="#14532d">pod container</text>
  <text x="832" y="144" text-anchor="middle" fill="#14532d">BuildKit rootless / Buildah</text>
  <rect x="740" y="210" width="185" height="60" rx="6" fill="#ffffff" stroke="#15803d"/>
  <text x="832" y="234" text-anchor="middle" fill="#14532d">registry (push directly)</text>
  <text x="832" y="254" text-anchor="middle" fill="#14532d">+ remote build cache</text>
  <line x1="832" y1="160" x2="832" y2="208" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="832" y="300" text-anchor="middle" fill="#14532d">no root daemon</text>
  <text x="832" y="320" text-anchor="middle" fill="#14532d">best for Kubernetes</text>

  <text x="480" y="375" text-anchor="middle" fill="#475569">Red → green = less power handed to the build. Kaniko upstream is archived (forks only). Topic 26.</text>
</svg>
