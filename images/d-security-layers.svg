<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <rect width="900" height="470" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">Securing Jenkins: layers from the outside in</text>
  <rect x="30" y="50" width="840" height="400" rx="14" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="50" y="74" font-weight="bold" fill="#0f172a">1 NETWORK: private subnet / VPN · HTTPS reverse proxy (WebSocket headers) · only /github-webhook/ public</text>
  <rect x="60" y="88" width="780" height="346" rx="12" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
  <text x="80" y="112" font-weight="bold" fill="#0c4a6e">2 AUTHENTICATION: SSO (OIDC / SAML / LDAP) · API tokens for scripts · break-glass escape hatch</text>
  <rect x="90" y="126" width="720" height="292" rx="12" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
  <text x="110" y="150" font-weight="bold" fill="#4c1d95">3 AUTHORIZATION: role-based / project matrix for IdP groups · few admins · Run Scripts = admin</text>
  <rect x="120" y="164" width="660" height="238" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="140" y="188" font-weight="bold" fill="#78350f">4 PIPELINE CODE: Groovy sandbox · careful script approval · trusted libraries reviewed</text>
  <rect x="150" y="202" width="600" height="184" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="170" y="226" font-weight="bold" fill="#14532d">5 BUILD ISOLATION: 0 controller executors · agents by trust level · ephemeral pods</text>
  <text x="170" y="248" fill="#14532d">folder-scoped credentials · no secrets for fork PRs · agent→controller access control on</text>
  <rect x="180" y="266" width="540" height="104" rx="12" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <text x="450" y="292" text-anchor="middle" font-weight="bold" fill="#0f172a">CROWN JEWELS: JENKINS_HOME</text>
  <text x="450" y="314" text-anchor="middle" fill="#0f172a">secrets/ · credentials.xml · Script Console</text>
  <text x="450" y="336" text-anchor="middle" fill="#0f172a">6 PATCHING: LTS updates · plugin advisories · few plugins</text>
  <text x="450" y="356" text-anchor="middle" fill="#0f172a">7 BACKUPS: encrypted, access-restricted, restore-tested</text>
  <text x="450" y="462" text-anchor="middle" fill="#475569" font-size="11">Topic 65</text>
</svg>
