<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <rect width="940" height="400" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
  <text x="470" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">Credentials: stored encrypted, used by ID, injected only for a block</text>

  <text x="230" y="64" text-anchor="middle" font-weight="bold" fill="#78350f">AT REST (controller JENKINS_HOME)</text>
  <rect x="20" y="76" width="130" height="60" rx="6" fill="#fef3c7" stroke="#b45309"/>
  <text x="85" y="102" text-anchor="middle" fill="#78350f">secrets/</text>
  <text x="85" y="120" text-anchor="middle" fill="#78350f">master.key</text>
  <rect x="170" y="76" width="130" height="60" rx="6" fill="#fef3c7" stroke="#b45309"/>
  <text x="235" y="102" text-anchor="middle" fill="#78350f">secrets/</text>
  <text x="235" y="120" text-anchor="middle" fill="#78350f">hudson.util.Secret</text>
  <rect x="320" y="76" width="150" height="60" rx="6" fill="#fef3c7" stroke="#b45309"/>
  <text x="395" y="102" text-anchor="middle" fill="#78350f">credentials.xml</text>
  <text x="395" y="120" text-anchor="middle" fill="#78350f">{AQAAAB…} ciphertext</text>
  <line x1="150" y1="106" x2="168" y2="106" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="300" y1="106" x2="318" y2="106" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="245" y="156" text-anchor="middle" fill="#b91c1c" font-size="12">back up secrets/ WITH the XML, or nothing decrypts</text>

  <text x="720" y="64" text-anchor="middle" font-weight="bold" fill="#1e3a8a">SCOPES</text>
  <rect x="540" y="76" width="380" height="80" rx="6" fill="#eff6ff" stroke="#1d4ed8"/>
  <text x="560" y="100" fill="#1e3a8a">Global → jobs + Jenkins itself</text>
  <text x="560" y="120" fill="#1e3a8a">System → Jenkins only (agent SSH keys, SMTP)</text>
  <text x="560" y="140" fill="#1e3a8a">Folder → only jobs inside that folder</text>

  <text x="470" y="200" text-anchor="middle" font-weight="bold" fill="#14532d">AT RUN TIME</text>
  <rect x="20" y="214" width="250" height="110" rx="8" fill="#f1f5f9" stroke="#475569"/>
  <text x="145" y="238" text-anchor="middle" font-weight="bold" fill="#0f172a">Jenkinsfile (no secrets)</text>
  <text x="35" y="262" fill="#0f172a" font-size="12">withCredentials([usernamePassword(</text>
  <text x="35" y="280" fill="#0f172a" font-size="12">  credentialsId: 'dockerhub', …)]) {</text>
  <text x="35" y="298" fill="#0f172a" font-size="12">  sh 'echo "$P" | docker login …' }</text>
  <rect x="345" y="214" width="250" height="110" rx="8" fill="#fef3c7" stroke="#b45309"/>
  <text x="470" y="238" text-anchor="middle" font-weight="bold" fill="#78350f">Controller</text>
  <text x="470" y="262" text-anchor="middle" fill="#78350f">check scope + permission</text>
  <text x="470" y="282" text-anchor="middle" fill="#78350f">decrypt</text>
  <text x="470" y="302" text-anchor="middle" fill="#78350f">register value for masking</text>
  <rect x="670" y="214" width="250" height="110" rx="8" fill="#dcfce7" stroke="#15803d"/>
  <text x="795" y="238" text-anchor="middle" font-weight="bold" fill="#14532d">Agent process</text>
  <text x="795" y="262" text-anchor="middle" fill="#14532d">env vars U / P (block only)</text>
  <text x="795" y="282" text-anchor="middle" fill="#14532d">or temp file in @tmp</text>
  <text x="795" y="302" text-anchor="middle" fill="#14532d">console shows ****</text>
  <line x1="270" y1="268" x2="343" y2="268" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="595" y1="268" x2="668" y2="268" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="420" y1="138" x2="450" y2="212" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>

  <text x="470" y="356" text-anchor="middle" fill="#b91c1c">Masking ≠ security: base64, files, images and double-quoted Groovy strings leak secrets.</text>
  <text x="470" y="380" text-anchor="middle" fill="#475569">Topics 16, 23, 24</text>
</svg>
