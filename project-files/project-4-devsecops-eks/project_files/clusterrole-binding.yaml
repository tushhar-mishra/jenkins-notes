# Audit fix: this used to be a cluster-wide ClusterRole + ClusterRoleBinding that also allowed
# creating/deleting ANY namespace and deleting pods/services in every namespace. A CI deployer
# only needs to manage its app's objects in ONE namespace, so this is now a namespaced Role +
# RoleBinding. A cluster admin creates the namespace once:
#   kubectl create namespace cwvj-devsecops
# (The file name is kept so the notes' links still work.)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jenkins-deployer
  namespace: cwvj-devsecops
rules:
  # Deployments: apply + rollout status + rollout undo
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  # rollout status / undo read ReplicaSets
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  # Services: apply
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  # Read-only Pod access for debugging a failed rollout
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events"]
    verbs: ["get", "list", "watch"]

---

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-deployer
  namespace: cwvj-devsecops
subjects:
  - kind: User
    name: jenkins-agent-role     # must match the username in the access entry / aws-auth
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: jenkins-deployer
  apiGroup: rbac.authorization.k8s.io
